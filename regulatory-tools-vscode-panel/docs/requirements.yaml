metadata:
  project: regulatory-tools-vscode-panel
  version: "0.1"
  description: >
    VS Code extension providing a regulatory compliance dashboard for SaMD projects.
    Surfaces forge health grades, traceability matrix coverage, and required artifact
    completeness for each code repo in the open VS Code workspace.

requirements:
  - id: REG-001
    title: Workspace Resolution via VS Code Folders Only
    description: >
      The panel shall resolve repos from vscode.workspace.workspaceFolders only.
      No workspace.toml or external config file shall be required or read.
    rationale: >
      The user exclusively opens projects via VS Code workspace folders; a TOML
      file requirement adds unnecessary configuration overhead.
    verification: >
      Unit test: workspaceFolders mock drives repo list; no fs.readFile call for
      any .toml file occurs during _resolveRepos().

  - id: REG-002
    title: Repo Type Auto-Detection
    description: >
      The panel shall classify a repo as "code" if its root contains pyproject.toml,
      setup.py, package.json, Cargo.toml, or go.mod, or if its src/ directory
      contains files with a source-code extension (.py, .js, .ts, .rb, .java, .cpp,
      .go, .rs). Otherwise the repo shall be classified as "docs".
    rationale: >
      Avoids requiring users to maintain type annotations in config files; classification
      is derivable from the contents that already exist in every code repo.
    verification: >
      Unit test: fixture directories with and without code markers are classified
      correctly by _detectRepoType().

  - id: REG-003
    title: Primary Repo Designation
    description: >
      The panel shall use the regulatory.primaryRepo VS Code setting to designate
      the primary code repo. If the setting is absent and exactly one code repo is
      detected, that repo shall be auto-selected as primary. If multiple code repos
      exist and no setting is configured, the panel shall render a configuration
      banner listing the available code repo names.
    rationale: >
      Traceability matrix parsing and artifact checks are scoped to one primary repo;
      requiring explicit config only when ambiguous reduces friction for typical
      single-project workspaces.
    verification: >
      Unit test: single code repo auto-selected; two code repos with no setting
      produces banner HTML containing both repo names.

  - id: REG-004
    title: Project Overview Table
    description: >
      The panel shall display a Project Overview table listing all repos in the
      workspace with their detected role (primary, supporting, docs), forge grade,
      requirement coverage percentage, and PASS/LINKED/FAIL/UNTESTED counts from
      the traceability matrix (primary repo only).
    rationale: >
      Provides a single-glance summary of regulatory status across a multi-repo
      SaMD workspace.
    verification: >
      Unit test: _buildProjectOverview() HTML contains role badges and grade badges
      matching the supplied healthMap and traceData inputs.

  - id: REG-005
    title: Forge Health and Git Meta via Shared Module
    description: >
      The panel shall invoke buildRepoOverview() and buildHealthCard() from
      forge-vscode-panel/src/shared.js for the Repository Overview table and
      Health Details cards. It shall not re-implement these functions.
    rationale: >
      A single implementation in shared.js ensures that changes to collector
      display logic, CSS, or the overview table automatically apply to both panels.
    verification: >
      Unit test: require() of shared.js succeeds and returns the expected exports;
      _buildRepoOverview() output is identical to buildRepoOverview() output for
      the same inputs.

  - id: REG-006
    title: Traceability Matrix Parsing
    description: >
      The panel shall parse docs/traceability_matrix.md from the primary repo via
      filesystem read (no subprocess) and extract coverage percentage and
      PASS/LINKED/FAIL/UNTESTED counts. If the file is absent, all cells shall
      show "—".
    rationale: >
      The traceability matrix is auto-generated by regulatory_tools and always
      present on disk after the last test run; no subprocess is needed.
    verification: >
      Unit test: _parseTraceabilityMatrix() returns correct counts from a fixture
      matrix string matching the confirmed regulatory_tools output format.

  - id: REG-007
    title: Missing Artifact Detection
    description: >
      The panel shall check for the presence of docs/requirements.yaml,
      docs/soup.yaml, docs/anomaly-log.yaml, docs/traceability_matrix.md, and a
      non-empty artifacts/evidence_runs/ directory in the primary repo, and render
      each item as present (✓) or missing (✗) in the Required Artifacts section.
    rationale: >
      IEC 62304 requires these machine-readable artifacts for Class B/C software;
      surfacing their absence in the IDE prompts the developer to create them before
      a submission audit.
    verification: >
      Unit test: _checkRequiredArtifacts() returns present=true for files that
      exist in a temp directory and present=false for those that do not.

  - id: REG-008
    title: RSK Requirement Presence Check
    description: >
      The panel shall scan docs/requirements.yaml in the primary repo for at least
      one requirement with an id matching RSK-NNN and report its absence as a
      missing artifact in the Required Artifacts section.
    rationale: >
      ISO 14971 mandates risk control measures; RSK-prefixed requirements are the
      machine-readable encoding of those controls. Their absence indicates incomplete
      risk management documentation.
    verification: >
      Unit test: _parseRskRequirements() returns true for a fixture YAML containing
      "id: RSK-001" and false for a fixture without any RSK- id.

  - id: REG-009
    title: Primary Repo Selection via Context Menu
    description: >
      The panel shall display a context menu when a user right-clicks a code repo row
      in the Project Overview table. The menu shall offer "Set as Primary" for
      non-primary code repos and "Unset Primary" for the currently-designated primary
      repo. Selecting an item shall write the regulatory.primaryRepo VS Code setting
      and trigger a dashboard refresh. Docs repo rows shall not show a context menu.
    rationale: >
      Avoids requiring the user to navigate to VS Code settings to change the primary
      repo designation; the primary repo controls which repo's artifact checks and
      traceability data are surfaced.
    verification: >
      Unit test: _buildProjectOverview() rows have data-repo-name, data-repo-type,
      and data-is-primary attributes with correct values for primary, supporting, and
      docs repos.
