metadata:
  project: regulatory_tools
  version: 1.0
  description: >
    helper tools for regulatory software engineering principles, including
    requirement definition, traceability validation, and documentation generation.


requirements:

  # ==============================
  # Verification and Documentation Requirements
  # ==============================
  - id: VER-001
    title: Requirement Definition Validation
    description: >
      The system shall validate requirement definition files for unique identifiers, 
      required fields, and structural correctness.

  - id: VER-002
    title: Test Reference Validation
    description: >
      The system shall detect and report requirement identifiers referenced in tests 
      that are not declared in the requirement definition file.

  - id: VER-003
    title: Orphan Requirement Detection
    description: >
      The system shall detect and report declared requirements that lack corresponding 
      test references.

  - id: VER-004
    title: Deterministic Traceability Output
    description: >
      Traceability matrices generated from identical requirement definitions and test 
      annotations shall be identical across executions.
  
  - id: VER-005
    title: Traceability Matrix Generation
    description: >
      The system shall generate a traceability matrix mapping
      requirement identifiers to verification artifacts derived
      from test annotations.

  - id: VER-006
    title: Requirement Reference Validation
    description: >
      The system shall validate that requirement identifiers
      referenced in verification artifacts conform to the
      defined requirement identifier format.

  - id: VER-007
    title: Deterministic Requirement Parsing
    description: >
      Requirement definition files shall be parsed deterministically
      such that identical inputs produce identical internal
      requirement representations.

  # ==============================
  # Documentation Requirements
  # ==============================

  - id: DOC-001
    title: Machine-Readable Requirements Definition
    description: >
      The project shall include a machine-readable
      requirements.yaml file defining system requirements.

  - id: DOC-002
    title: Basic Project Documentation
    description: >
      The project shall include a README file describing
      system purpose, configuration, and execution steps.
  
  - id: DOC-003
    title: Traceability Documentation Generation
    description: >
      The system shall generate documentation artifacts describing
      traceability relationships between requirements and
      verification artifacts.

  - id: DOC-004
    title: Requirements Summary Generation
    description: >
      The system shall support generation of summary documentation
      describing declared requirements and their associated metadata.

  # ==============================
  # Infrastructure Requirements
  # ==============================

  - id: INF-001
    title: Artifact Collection Support
    description: >
      The system shall collect and organize verification artifacts with associated 
      provenance metadata including timestamp and source identifier.

  - id: INF-002
    title: Configuration Schema Validation
    description: >
      Configuration inputs shall be validated against defined schemas prior to execution.
  
  - id: INF-003
    title: Verification Artifact Persistence
    description: >
      Verification artifacts shall be persisted in a structured
      machine-readable format suitable for automated processing.

  - id: INF-004
    title: Evidence Artifact Association
    description: >
      Verification artifacts shall include references to the
      requirement identifiers they verify.
  
  # ==============================
  # System Requirements
  # ==============================

  - id: SYS-001
    title: CI-Compatible Execution
    description: >
      All validation and documentation workflows shall execute deterministically in 
      non-interactive continuous integration environments.
  
  - id: SYS-002
    title: Deterministic Artifact Generation
    description: >
      Documentation and traceability artifacts generated from
      identical inputs shall be identical across executions.

  # ==============================
  # DHF Generation Requirements
  # ==============================

  - id: DHF-001
    title: Requirements Schema Supports Typed Requirements
    description: >
      The requirements.yaml schema shall support an optional `type` field
      (user_need | system_requirement | design_requirement | risk_control)
      and an optional `derived_from` field (list of requirement IDs).
      Entries without `type` shall be treated as system_requirement.

  - id: DHF-002
    title: DHF Placeholder Substitution
    description: >
      The system shall substitute known {{PLACEHOLDER}} values in DHF markdown
      documents from a project context config, leave unknown placeholders
      unchanged, and report a list of unfilled placeholder names.

  - id: DHF-003
    title: Auto-Populated Document Generation
    description: >
      The system shall generate content for all Auto-level DHF documents:
      system_requirements, traceability_index, soup_register, evidence_index,
      baseline_register, and change_log.

  - id: DHF-004
    title: Partial-Populated Document Generation
    description: >
      The system shall generate RSK-requirement scaffolding rows for
      risk_control_measures.md and residual_risk_evaluation.md, leaving
      narrative columns empty for manual completion.

  - id: DHF-005
    title: DHF Section Scaffolding
    description: >
      The system shall copy missing DHF sections from a templates directory
      into the DHF repo and run placeholder substitution on the copied files,
      leaving existing sections untouched.

  - id: DHF-006
    title: DHF Generation Idempotency
    description: >
      Running DHFGenerator.run_all() twice on the same inputs shall produce
      identical output on the second run (no spurious git diffs).

  - id: DHF-007
    title: Requirements Traceability Through Derived Links
    description: >
      The system shall be able to enumerate, for a given user_need requirement
      ID, all system_requirements derived from it and all tests that verify
      those requirements.

  - id: DHF-008
    title: System Requirements Summary Generation
    description: >
      The system shall generate a requirements summary table from
      requirements.yaml, showing count and types of requirements per domain
      prefix.

  - id: DHF-009
    title: Input Contract Validation
    description: >
      Before any generation, the system shall validate that all input files
      (requirements.yaml, soup.yaml, dhf_context.yaml, evidence_runs directory)
      are present, parseable, and schema-correct. It shall raise a typed
      DHFValidationError with a structured message identifying every violation
      found. The generator shall not proceed past this step if any check fails.

  - id: DHF-010
    title: Stale Filled-Value Detection and Update
    description: >
      Values previously auto-filled by the generator shall be wrapped in HTML
      sentinel comments so that a subsequent run can find and overwrite them
      when the source value changes, without overwriting values that were filled
      manually (no sentinel wrapper).

  - id: DHF-011
    title: Derived-From Completeness Enforcement
    description: >
      The DHFValidator shall reject any non-user_need requirement that has
      an empty or absent derived_from field, listing all offending IDs in
      the DHFValidationError.
    rationale: >
      An orphaned requirement (no declared parent) produces a silent gap in the
      requirements traceability chain. IEC 62304 §5.5.5 requires that every
      software requirement is traceable to a higher-level source; this validator
      rule makes that constraint machine-checkable before documents are generated.
    verification: >
      Unit tests: a non-user_need requirement with empty derived_from raises
      DHFValidationError; a user_need with no derived_from passes.

  - id: DHF-012
    title: Source File Visibility in RTM and Requirements Summary
    description: >
      Each Requirement object shall carry a source_file field (filename stem of
      the file it was loaded from). The traceability matrix shall include a Source
      column and the system_requirements summary shall include a By Source File
      table so reviewers can distinguish SRS from SDS verification rows without
      cross-referencing a separate key.
    rationale: >
      After the requirements file split, a reviewer scanning the RTM must be able
      to identify whether a row is SRS verification (IEC 62304 §5.2) or SDS
      verification (§5.4) without needing to know the type-to-file convention.
    verification: >
      Unit tests: RequirementsReader sets source_file to path stem for each
      Requirement; SystemRequirementsGenerator output contains "By Source File"
      table; traceability matrix write_markdown includes Source column.

  - id: DHF-013
    title: Per-File Prefix and Type Constraint Validation
    description: >
      The DHFValidator shall read metadata.allowed_prefixes and
      metadata.allowed_types from each requirement file and reject any requirement
      whose ID prefix is not in allowed_prefixes or whose type is not in
      allowed_types. A missing metadata.file_role field in any requirement file
      shall also be reported as a violation.
    rationale: >
      Without this check, a requirement placed in the wrong file silently routes
      to the wrong DHF document. The metadata block in each file is the authority
      for what belongs there; the validator enforces the contract.
    verification: >
      Unit tests: ID prefix not in allowed_prefixes raises DHFValidationError;
      type not in allowed_types raises; missing file_role raises; valid files pass.

  - id: DHF-014
    title: Hazard Analysis Scaffold Generation
    description: >
      The system shall generate scaffold rows for hazard_analysis.md from
      hazard_analysis.yaml, populating HAZ-ID, hazard title, and mitigation_ref
      columns. The cause, effect, severity, and probability columns shall be
      left as <!-- FILL --> for manual completion.
    rationale: >
      ISO 14971 §4-5 requires a systematic hazard analysis whose identification
      step is separate from the risk estimation step. Auto-generating the scaffold
      ensures the HAZ-ID cross-reference to risk_controls.yaml is always in sync;
      the narrative columns remain manual because they require domain expertise.
    verification: >
      Unit test: hazard_analysis.yaml with 2 HAZ entries produces a table with
      2 scaffold rows; cause/effect/severity/probability columns contain
      <!-- FILL -->; mitigation_ref column shows the hazard_ref value.

  # ==============================
  # Risk Requirements
  # ==============================

  - id: RSK-001
    title: Evidence Classification Support
    description: >
      Evidence artifacts shall support structured severity levels and classification 
      metadata suitable for risk-based reporting.

  - id: RSK-002
    title: Risk Metadata Preservation
    description: >
      Evidence artifacts containing risk classification metadata
      shall preserve that metadata when aggregated into reporting
      outputs.