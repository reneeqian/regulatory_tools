metadata:
  project: regulatory_tools
  samd_class: tool  # Not a SaMD — generates regulatory artifacts (DHF docs, evidence) that feed submissions
  version: 1.0
  description: >
    helper tools for regulatory software engineering principles, including
    requirement definition, traceability validation, and documentation generation.


requirements:

  # ==============================
  # Verification and Documentation Requirements
  # ==============================
  - id: VER-001
    title: Requirement Definition Validation
    description: >
      The system shall validate requirement definition files for unique identifiers, 
      required fields, and structural correctness.

  - id: VER-002
    title: Test Reference Validation
    description: >
      The system shall detect and report requirement identifiers referenced in tests 
      that are not declared in the requirement definition file.

  - id: VER-003
    title: Orphan Requirement Detection
    description: >
      The system shall detect and report declared requirements that lack corresponding 
      test references.

  - id: VER-004
    title: Deterministic Traceability Output
    description: >
      Traceability matrices generated from identical requirement definitions and test 
      annotations shall be identical across executions.
  
  - id: VER-005
    title: Traceability Matrix Generation
    description: >
      The system shall generate a traceability matrix mapping
      requirement identifiers to verification artifacts derived
      from test annotations.

  - id: VER-006
    title: Requirement Reference Validation
    description: >
      The system shall validate that requirement identifiers
      referenced in verification artifacts conform to the
      defined requirement identifier format.

  - id: VER-007
    title: Deterministic Requirement Parsing
    description: >
      Requirement definition files shall be parsed deterministically
      such that identical inputs produce identical internal
      requirement representations.

  # ==============================
  # Documentation Requirements
  # ==============================

  - id: DOC-001
    title: Machine-Readable Requirements Definition
    description: >
      The project shall include a machine-readable
      requirements.yaml file defining system requirements.

  - id: DOC-002
    title: Basic Project Documentation
    description: >
      The project shall include a README file describing
      system purpose, configuration, and execution steps.
  
  - id: DOC-003
    title: Traceability Documentation Generation
    description: >
      The system shall generate documentation artifacts describing
      traceability relationships between requirements and
      verification artifacts.

  - id: DOC-004
    title: Requirements Summary Generation
    description: >
      The system shall support generation of summary documentation
      describing declared requirements and their associated metadata.

  # ==============================
  # Infrastructure Requirements
  # ==============================

  - id: INF-001
    title: Artifact Collection Support
    description: >
      The system shall collect and organize verification artifacts with associated 
      provenance metadata including timestamp and source identifier.

  - id: INF-002
    title: Configuration Schema Validation
    description: >
      Configuration inputs shall be validated against defined schemas prior to execution.
  
  - id: INF-003
    title: Verification Artifact Persistence
    description: >
      Verification artifacts shall be persisted in a structured
      machine-readable format suitable for automated processing.

  - id: INF-004
    title: Evidence Artifact Association
    description: >
      Verification artifacts shall include references to the
      requirement identifiers they verify.
  
  # ==============================
  # System Requirements
  # ==============================

  - id: SYS-001
    title: CI-Compatible Execution
    description: >
      All validation and documentation workflows shall execute deterministically in 
      non-interactive continuous integration environments.
  
  - id: SYS-002
    title: Deterministic Artifact Generation
    description: >
      Documentation and traceability artifacts generated from
      identical inputs shall be identical across executions.

  # ==============================
  # DHF Generation Requirements
  # ==============================

  - id: DHF-001
    title: Requirements Schema Supports Typed Requirements
    description: >
      The requirements.yaml schema shall support an optional `type` field
      (user_need | system_requirement | design_requirement | risk_control)
      and an optional `derived_from` field (list of requirement IDs).
      Entries without `type` shall be treated as system_requirement.

  - id: DHF-002
    title: DHF Placeholder Substitution
    description: >
      The system shall substitute known {{PLACEHOLDER}} values in DHF markdown
      documents from a project context config, leave unknown placeholders
      unchanged, and report a list of unfilled placeholder names.

  - id: DHF-003
    title: Auto-Populated Document Generation
    description: >
      The system shall generate content for all Auto-level DHF documents:
      system_requirements, traceability_index, soup_register, evidence_index,
      baseline_register, and change_log.

  - id: DHF-004
    title: Partial-Populated Document Generation
    description: >
      The system shall generate RSK-requirement scaffolding rows for
      risk_control_measures.md and residual_risk_evaluation.md, leaving
      narrative columns empty for manual completion.

  - id: DHF-005
    title: DHF Section Scaffolding
    description: >
      The system shall copy missing DHF sections from a templates directory
      into the DHF repo and run placeholder substitution on the copied files,
      leaving existing sections untouched.

  - id: DHF-006
    title: DHF Generation Idempotency
    description: >
      Running DHFGenerator.run_all() twice on the same inputs shall produce
      identical output on the second run (no spurious git diffs).

  - id: DHF-007
    title: Requirements Traceability Through Derived Links
    description: >
      The system shall be able to enumerate, for a given user_need requirement
      ID, all system_requirements derived from it and all tests that verify
      those requirements.

  - id: DHF-008
    title: System Requirements Summary Generation
    description: >
      The system shall generate a requirements summary table from
      requirements.yaml, showing count and types of requirements per domain
      prefix.

  - id: DHF-009
    title: Input Contract Validation
    description: >
      Before any generation, the system shall validate that all input files
      (requirements.yaml, soup.yaml, dhf_context.yaml, evidence_runs directory)
      are present, parseable, and schema-correct. It shall raise a typed
      DHFValidationError with a structured message identifying every violation
      found. The generator shall not proceed past this step if any check fails.

  - id: DHF-010
    title: Stale Filled-Value Detection and Update
    description: >
      Values previously auto-filled by the generator shall be wrapped in HTML
      sentinel comments so that a subsequent run can find and overwrite them
      when the source value changes, without overwriting values that were filled
      manually (no sentinel wrapper).

  - id: DHF-011
    title: Derived-From Completeness Enforcement
    description: >
      The DHFValidator shall reject any non-user_need requirement that has
      an empty or absent derived_from field, listing all offending IDs in
      the DHFValidationError.
    rationale: >
      An orphaned requirement (no declared parent) produces a silent gap in the
      requirements traceability chain. IEC 62304 §5.5.5 requires that every
      software requirement is traceable to a higher-level source; this validator
      rule makes that constraint machine-checkable before documents are generated.
    verification: >
      Unit tests: a non-user_need requirement with empty derived_from raises
      DHFValidationError; a user_need with no derived_from passes.

  - id: DHF-012
    title: Full Traceability Columns in RTM and Requirements Summary
    description: >
      Each Requirement object shall carry a source_file field (filename stem of
      the file it was loaded from). The traceability matrix shall include the
      following columns: Requirement ID, Source, Title, Derived From
      (comma-separated parent IDs from the derived_from field), Design Spec
      (comma-separated IDs of design requirements whose derived_from contains
      this requirement's ID), Risk Ref (comma-separated IDs of risk controls
      whose derived_from contains this requirement's ID), Verification Method
      (the verification_method field value — T/I/A/D — or blank if absent),
      Safety Relevant (Yes or blank from the safety_relevant boolean field),
      Linked Tests, Evidence Artifacts, and Status. The Status column shall use
      the following values: PASS (direct evidence exists), COVERED (no direct
      evidence but all derived requirements in the matrix are PASS or COVERED —
      verified through the chain), FAIL (any evidence record failed or any derived
      requirement is FAIL), LINKED (test markers present but no evidence), UNTESTED
      (no evidence, no markers, and chain coverage is incomplete or absent). COVERED
      status shall be computed iteratively to handle multi-level hierarchies. The
      system_requirements summary shall include a By Source File table so reviewers
      can distinguish SRS from SDS verification rows without cross-referencing
      a separate key.
    rationale: >
      IEC 62304 §5.5.5 and §8.1.3 require a complete vertical trace chain.
      User needs and high-level system requirements are verified through their
      derived requirements, not through direct unit tests; marking them UNTESTED
      when all their children pass is misleading to a 510(k) reviewer. COVERED
      correctly represents inherited verification. Derived From allows upward
      navigation; Design Spec and Risk Ref allow downward navigation to the design
      and risk layers. Verification Method satisfies IEC 62304 §5.7. Safety Relevant
      flags requirements affecting patient safety. Together these columns make
      the RTM a self-contained 510(k) trace artifact without requiring a reviewer
      to cross-reference separate documents.
    verification: >
      Unit tests: RequirementsReader sets source_file to path stem for each
      Requirement; load_requirements stores derived_from, verification_method,
      and safety_relevant per requirement; build_trace_matrix rows include
      design_refs and risk_refs computed by reverse derived_from lookup;
      write_markdown output includes all column headers (Source, Derived From,
      Design Spec, Risk Ref, Verification Method, Safety Relevant);
      SystemRequirementsGenerator output contains "By Source File" table.

  - id: DHF-013
    title: Per-File Prefix and Type Constraint Validation
    description: >
      The DHFValidator shall read metadata.allowed_prefixes and
      metadata.allowed_types from each requirement file and reject any requirement
      whose ID prefix is not in allowed_prefixes or whose type is not in
      allowed_types. A missing metadata.file_role field in any requirement file
      shall also be reported as a violation.
    rationale: >
      Without this check, a requirement placed in the wrong file silently routes
      to the wrong DHF document. The metadata block in each file is the authority
      for what belongs there; the validator enforces the contract.
    verification: >
      Unit tests: ID prefix not in allowed_prefixes raises DHFValidationError;
      type not in allowed_types raises; missing file_role raises; valid files pass.

  - id: DHF-014
    title: Hazard Analysis Scaffold Generation
    description: >
      The system shall generate scaffold rows for hazard_analysis.md from
      hazard_analysis.yaml, populating HAZ-ID, hazard title, and mitigation_ref
      columns. The cause, effect, severity, and probability columns shall be
      left as <!-- FILL --> for manual completion.
    rationale: >
      ISO 14971 §4-5 requires a systematic hazard analysis whose identification
      step is separate from the risk estimation step. Auto-generating the scaffold
      ensures the HAZ-ID cross-reference to risk_controls.yaml is always in sync;
      the narrative columns remain manual because they require domain expertise.
    verification: >
      Unit test: hazard_analysis.yaml with 2 HAZ entries produces a table with
      2 scaffold rows; cause/effect/severity/probability columns contain
      <!-- FILL -->; mitigation_ref column shows the hazard_ref value.

  - id: DHF-015
    title: DHF Change Impact Analysis
    description: >
      The system shall provide a DHFImpactAnalyzer that, given a list of changed
      file paths relative to the project root, returns a structured impact report
      classifying affected DHF sections as auto (regenerated by generate_dhf.py)
      or manual (require human review). The analyzer shall expose a CLI entry point
      so it can be called from CI scripts and shell commands.
    rationale: >
      Without impact detection, developers have no systematic signal for when to run
      generate_dhf.py or which manual DHF sections need review after a code change.
      Unreviewed changes in risk controls, hazard analysis, or intended use represent
      a regulatory gap even when the auto-generated sections are current. This analyzer
      closes that gap by making the review obligation explicit and traceable to each PR.
    verification: >
      Unit tests: changed docs/requirements.yaml triggers auto section for
      system_requirements; changed docs/risk_controls.yaml triggers manual section for
      risk_control_measures; changed src/ triggers manual section for SDP; no changed
      files returns empty report; CLI exits 0 and prints structured output.

  # ==============================
  # Risk Requirements
  # ==============================

  - id: RSK-001
    title: Evidence Classification Support
    description: >
      Evidence artifacts shall support structured severity levels and classification 
      metadata suitable for risk-based reporting.

  - id: RSK-002
    title: Risk Metadata Preservation
    description: >
      Evidence artifacts containing risk classification metadata
      shall preserve that metadata when aggregated into reporting
      outputs.

  # ==============================
  # Verification Gate Requirements
  # ==============================

  - id: VER-008
    title: SOUP Field Completeness Check
    description: >
      The system shall verify that each entry in docs/soup.yaml has
      intended_use, risk, and verified_by fields, and that no entry uses the
      non-standard purpose field name. Any missing or mis-named field shall be
      reported as a violation.
    rationale: >
      soup_checker.py today only checks name coverage (is the dep listed?). It
      does not validate field content. The forge audit found all 4 forge SOUP
      entries missing risk/verified_by with wrong field names — undetected by CI.
      Field-level validation closes that gap.
    verification: >
      Unit tests: entry missing intended_use triggers violation; entry using
      purpose triggers violation; entry missing risk triggers violation; entry
      missing verified_by triggers violation; fully-populated entry passes.

  - id: VER-009
    title: Version Baseline Consistency Check
    description: >
      The system shall verify that the version field in pyproject.toml matches
      the latest semantic version git tag (stripped of leading v). If no git
      tags exist the check shall warn but not fail. If tags exist and the
      version does not match, the check shall report a violation.
    rationale: >
      IEC 62304 §8.1.1 requires a version baseline. In this workspace, git tags
      are the baseline mechanism. The audit found regulatory_tools at version
      0.1.0 while the latest tag was v1.1.0 — pyproject.toml version was never
      bumped. A CI-enforced check would have caught this immediately.
    verification: >
      Unit tests: pyproject version matching latest tag passes; version mismatch
      reports violation; no git tags returns warning (no violation).

  - id: VER-010
    title: Anomaly Log Existence Check
    description: >
      For packages with samd_class of A, B, C, or tool, the system shall verify
      that docs/anomaly_log.yaml exists. Absence shall be reported as a violation.
      Packages with samd_class of utility shall be skipped.
    rationale: >
      IEC 62304 §9.1 requires a formal problem resolution record. Without a CI
      check, the anomaly log was absent from all four packages and only created
      manually after an audit. Automated presence check ensures it is never
      silently absent after package creation.
    verification: >
      Unit tests: anomaly_log.yaml present → passes; absent + samd_class C →
      violation; absent + samd_class utility → no violation.

  - id: VER-011
    title: LINKED Requirements Gate
    description: >
      For packages with samd_class of A, B, C, or tool, the system shall read
      the generated docs/traceability_matrix.md after matrix generation and fail
      the verification run if any requirement has LINKED status. The list of
      LINKED requirement IDs shall be printed. Packages with samd_class of
      utility shall be skipped.
    rationale: >
      LINKED means a test exists but no EvidenceReport.auto_save() was called —
      the test ran but produced no machine-readable evidence. For tool/SaMD
      packages every test must produce evidence (per coding best practices). The
      audit found 19 LINKED requirements in regulatory_tools; CI never flagged
      them. This check makes LINKED accumulation a CI gate, not a silent metric.
    verification: >
      Unit tests: traceability_matrix.md with 0 LINKED rows passes; 1+ LINKED
      rows + samd_class C exits 1; samd_class utility passes regardless.

  # ==============================
  # DHF Generation Requirements (continued)
  # ==============================

  - id: DHF-016
    title: Anomaly Log DHF Generation
    description: >
      The system shall generate the Anomaly Table and Unresolved Anomalies
      sections in anomaly_log.md from anomaly_log.yaml, using sentinel markers
      DHF_ANOMALY_TABLE and DHF_UNRESOLVED_ANOMALIES. The Anomaly Table shall
      include all entries; the Unresolved Anomalies table shall include only
      entries whose status field is open, in_progress, or deferred
      (case-insensitive). Missing optional fields (safety_impact, linked_pr,
      closed) shall render as —. An empty anomalies list shall produce no rows
      (header retained by the sentinel block).
    rationale: >
      anomaly_log.yaml is the machine-readable source of truth for IEC 62304 §9.
      Without a generator, the anomaly_log.md DHF document must be maintained
      manually in parallel, which creates divergence risk. Following the
      hazard_analysis pattern, the YAML drives both the DHF document and any
      CI checks.
    verification: >
      Unit tests: yaml with 2 entries produces 2 table rows; empty anomalies
      produces 0 rows (header retained); open anomaly appears in unresolved
      section; closed anomaly does not; optional fields absent render as —;
      update_document is idempotent on second run.